# ─────────────────────────────────────────────────────────────────────────────
#  PR Validation Pipeline
#  Runs on every Pull Request targeting main or develop.
#  Builds + tests both services. Does NOT push images or touch Azure.
#
#  ADO setup: create this pipeline and set it as a branch policy on main.
# ─────────────────────────────────────────────────────────────────────────────
trigger: none   # Only runs as a PR check, never on direct push

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - infrastructure/**
      - pipelines/**
      - '**/*.md'

pool:
  vmImage: ubuntu-latest

stages:

  # ─────────────────────────────────────────────────────────────────────────
  - stage: Validate
    displayName: PR Validation
    jobs:

      # ── .NET Backend ──────────────────────────────────────────────────────
      - job: BackendValidation
        displayName: Build & Test Backend (.NET 10)
        steps:
          - template: templates/steps-build-dotnet.yml
            parameters:
              configuration: Release
              runTests: true
              publishArtifact: false

      # ── Angular Frontend ──────────────────────────────────────────────────
      - job: FrontendValidation
        displayName: Build Frontend (Angular 21)
        steps:
          - template: templates/steps-build-angular.yml
            parameters:
              publishArtifact: false

      # ── Playwright E2E Smoke Tests ────────────────────────────────────────
      # Runs against the deployed dev environment so no local stack is needed.
      # BASE_URL and API_URL come from a variable group — set in ADO Library.
      # On PRs that don't have a deployed env available, set SKIP_E2E=true in
      # the pipeline variables to skip this job.
      - job: E2ESmokeTests
        displayName: E2E Smoke Tests (Playwright)
        dependsOn: [BackendValidation, FrontendValidation]
        condition: |
          and(
            succeeded('BackendValidation'),
            succeeded('FrontendValidation'),
            ne(variables['SKIP_E2E'], 'true')
          )
        variables:
          - group: nhsnlink-dev-urls  # ADO Library variable group: BASE_URL, API_URL
        steps:
          - template: templates/steps-e2e-playwright.yml
            parameters:
              baseUrl: $(BASE_URL)
              apiUrl: $(API_URL)
              publishReport: true

      # ── Docker build check (no push) ──────────────────────────────────────
      # Validates Dockerfiles compile without pushing to a registry.
      - job: DockerValidation
        displayName: Docker Build Check (no push)
        dependsOn: []   # Run in parallel with the above
        steps:
          - script: |
              docker build \
                -f DotNet/OnboardingService/Dockerfile \
                -t nhsnlink-onboarding-service:pr-check \
                .
            displayName: 'docker build — onboarding-service'

          - script: |
              docker build \
                -f Web/Dockerfile \
                -t nhsnlink-onboarding-web:pr-check \
                Web/
            displayName: 'docker build — onboarding-web'
