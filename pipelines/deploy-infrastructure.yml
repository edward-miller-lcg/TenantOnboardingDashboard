# ─────────────────────────────────────────────────────────────────────────────
#  Infrastructure Deployment Pipeline
#  Manual trigger only (or on changes to infrastructure/** on main).
#  Deploys Bicep or Terraform to a target environment with approval gates.
#
#  Required variable groups (per environment):
#    nhsnlink-onboarding-dev:
#      AZURE_SERVICE_CONNECTION   - service connection with Contributor on RG
#      RESOURCE_GROUP             - e.g. rg-nhsnlink-onboarding-dev
#      SQL_ADMIN_PASSWORD         - (secret) SQL Server password
#      TENANT_SERVICE_URL
#      DATA_ACQUISITION_URL
#      REPORT_SERVICE_URL
#      NORMALIZATION_SERVICE_URL
#    nhsnlink-onboarding-prod:    - same keys, prod values
# ─────────────────────────────────────────────────────────────────────────────
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

pr: none

parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: tool
    displayName: IaC Tool
    type: string
    default: bicep
    values:
      - bicep
      - terraform

  - name: destroyFirst
    displayName: Destroy before deploy (DANGEROUS — use only in dev)
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

stages:

  # ─── Preview / Plan ────────────────────────────────────────────────────────
  - stage: Preview
    displayName: 'Preview (${{ parameters.tool }} / ${{ parameters.environment }})'
    variables:
      - group: nhsnlink-onboarding-${{ parameters.environment }}
    jobs:
      - job: Plan
        displayName: ${{ upper(parameters.tool) }} preview
        steps:
          - checkout: self

          - ${{ if eq(parameters.tool, 'bicep') }}:
            - task: AzureCLI@2
              displayName: 'az deployment what-if'
              inputs:
                azureSubscription: $(AZURE_SERVICE_CONNECTION)
                scriptType: bash
                scriptLocation: inlineScript
                # az deployment group what-if requires the RG to exist (group-scoped operation).
                # Create it here so what-if works even after a teardown.
                # SQL_ADMIN_PASSWORD is read by readEnvironmentVariable() inside the .bicepparam file.
                inlineScript: |
                  # Only create RG if it doesn't already exist — avoids InvalidResourceGroupLocation
                  # when the RG was previously created in a different region.
                  if ! az group exists --name "$(RESOURCE_GROUP)" | grep -q "true"; then
                    az group create \
                      --name     "$(RESOURCE_GROUP)" \
                      --location "centralus" \
                      --tags     application=nhsnlink-onboarding environment=${{ parameters.environment }}
                  else
                    echo "Resource group already exists — skipping creation."
                  fi

                  az deployment group what-if \
                    --resource-group "$(RESOURCE_GROUP)" \
                    --template-file  infrastructure/main.bicep \
                    --parameters     infrastructure/${{ parameters.environment }}.bicepparam
              env:
                SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

          - ${{ if eq(parameters.tool, 'terraform') }}:
            - task: TerraformInstaller@1
              displayName: 'Install Terraform'
              inputs:
                terraformVersion: 'latest'

            - task: TerraformTaskV4@4
              displayName: 'terraform init'
              inputs:
                provider: azurerm
                command: init
                workingDirectory: infrastructure/terraform
                backendServiceArm: $(AZURE_SERVICE_CONNECTION)
                backendAzureRmResourceGroupName: rg-tfstate
                backendAzureRmStorageAccountName: nhsnobtfstate
                backendAzureRmContainerName: tfstate
                backendAzureRmKey: nhsnlink-onboarding-${{ parameters.environment }}.tfstate

            - task: TerraformTaskV4@4
              displayName: 'terraform plan'
              inputs:
                provider: azurerm
                command: plan
                workingDirectory: infrastructure/terraform
                commandOptions: >
                  -var-file=environments/${{ parameters.environment }}.tfvars
                  -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)"
                  -out=tfplan
                environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

  # ─── Deploy ────────────────────────────────────────────────────────────────
  # Uses ADO Environments for prod approval gate.
  # Create environment "nhsnlink-prod" in ADO → Approvals → add your approver(s).
  - stage: Deploy
    displayName: 'Deploy (${{ parameters.tool }} / ${{ parameters.environment }})'
    dependsOn: Preview
    condition: succeeded()
    variables:
      - group: nhsnlink-onboarding-${{ parameters.environment }}
    jobs:
      - deployment: DeployInfrastructure
        displayName: Deploy infrastructure
        environment: nhsnlink-${{ parameters.environment }}   # Approval gate lives here
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - ${{ if eq(parameters.tool, 'bicep') }}:
                  - task: AzureCLI@2
                    displayName: 'az deployment group create'
                    inputs:
                      azureSubscription: $(AZURE_SERVICE_CONNECTION)
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail
                        if ! az group exists --name "$(RESOURCE_GROUP)" | grep -q "true"; then
                          az group create \
                            --name     "$(RESOURCE_GROUP)" \
                            --location "centralus" \
                            --tags     application=nhsnlink-onboarding environment=${{ parameters.environment }}
                        else
                          echo "Resource group already exists — skipping creation."
                        fi

                        az deployment group create \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --template-file  infrastructure/main.bicep \
                          --parameters     infrastructure/${{ parameters.environment }}.bicepparam \
                          --name           "nhsnlink-onboarding-$(Build.BuildId)"

                        echo "Outputs:"
                        az deployment group show \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --name "nhsnlink-onboarding-$(Build.BuildId)" \
                          --query properties.outputs \
                          --output json
                    env:
                      SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)

                  # ── Bootstrap images & retry ──────────────────────────────
                  # On the very first deployment, ACR is created but no images
                  # exist yet, so Container Apps fail to provision. This step:
                  #   1. Detects if Container Apps are missing (chicken-and-egg)
                  #   2. Pushes lightweight placeholder images into ACR
                  #   3. Re-runs the Bicep deployment so Container Apps succeed
                  # On subsequent runs the images already exist — this is a no-op.
                  - task: AzureCLI@2
                    displayName: 'Bootstrap ACR images & retry if Container Apps missing'
                    condition: always()   # run even if the deployment above failed
                    inputs:
                      azureSubscription: $(AZURE_SERVICE_CONNECTION)
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set +e

                        # Discover the ACR that was just created (avoid hardcoding the name)
                        ACR_NAME=$(az acr list \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --query "[0].name" -o tsv 2>/dev/null)

                        if [ -z "$ACR_NAME" ]; then
                          echo "ACR not found — deployment failed before ACR was created. Nothing to bootstrap."
                          exit 0
                        fi

                        echo "Found ACR: $ACR_NAME"
                        SERVER="${ACR_NAME}.azurecr.io"
                        IMAGE_TAG="${PARAM_IMAGE_TAG:-dev}"
                        PUSHED=false

                        az acr login --name "$ACR_NAME"

                        push_placeholder() {
                          local repo="$1" source="$2"
                          local tags
                          tags=$(az acr repository show-tags \
                            --name "$ACR_NAME" --repository "$repo" \
                            -o tsv 2>/dev/null || true)
                          if echo "$tags" | grep -q "^${IMAGE_TAG}$"; then
                            echo "  $repo:$IMAGE_TAG already in ACR — skipping"
                          else
                            echo "  Pushing placeholder $repo:$IMAGE_TAG from $source"
                            docker pull "$source"
                            docker tag  "$source" "$SERVER/$repo:$IMAGE_TAG"
                            docker push "$SERVER/$repo:$IMAGE_TAG"
                            PUSHED=true
                          fi
                        }

                        push_placeholder nhsnlink-onboarding-service mcr.microsoft.com/dotnet/aspnet:10.0
                        push_placeholder nhsnlink-onboarding-web     nginx:alpine

                        if [ "$PUSHED" = "true" ]; then
                          echo ""
                          echo "Placeholder images pushed — re-running Bicep so Container Apps can provision..."
                          az deployment group create \
                            --resource-group "$(RESOURCE_GROUP)" \
                            --template-file  infrastructure/main.bicep \
                            --parameters     infrastructure/${{ parameters.environment }}.bicepparam \
                            --name           "nhsnlink-onboarding-bootstrap-$(Build.BuildId)"
                          echo ""
                          echo "Bootstrap deployment complete."
                        else
                          echo "All images already present — no bootstrap needed."
                        fi

                        exit 0
                    env:
                      SQL_ADMIN_PASSWORD: $(SQL_ADMIN_PASSWORD)
                      PARAM_IMAGE_TAG: ${{ parameters.environment == 'prod' && 'latest' || 'dev' }}

                - ${{ if eq(parameters.tool, 'terraform') }}:
                  - task: TerraformInstaller@1
                    displayName: 'Install Terraform'
                    inputs:
                      terraformVersion: 'latest'

                  - task: TerraformTaskV4@4
                    displayName: 'terraform init'
                    inputs:
                      provider: azurerm
                      command: init
                      workingDirectory: infrastructure/terraform
                      backendServiceArm: $(AZURE_SERVICE_CONNECTION)
                      backendAzureRmResourceGroupName: rg-tfstate
                      backendAzureRmStorageAccountName: nhsnobtfstate
                      backendAzureRmContainerName: tfstate
                      backendAzureRmKey: nhsnlink-onboarding-${{ parameters.environment }}.tfstate

                  - task: TerraformTaskV4@4
                    displayName: 'terraform apply'
                    inputs:
                      provider: azurerm
                      command: apply
                      workingDirectory: infrastructure/terraform
                      commandOptions: >
                        -var-file=environments/${{ parameters.environment }}.tfvars
                        -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)"
                        -auto-approve
                      environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)
