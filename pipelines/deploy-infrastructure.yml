# ─────────────────────────────────────────────────────────────────────────────
#  Infrastructure Deployment Pipeline
#  Manual trigger only (or on changes to infrastructure/** on main).
#  Deploys Bicep or Terraform to a target environment with approval gates.
#
#  Required variable groups (per environment):
#    nhsnlink-onboarding-dev:
#      AZURE_SERVICE_CONNECTION   - service connection with Contributor on RG
#      RESOURCE_GROUP             - e.g. rg-nhsnlink-onboarding-dev
#      SQL_ADMIN_PASSWORD         - (secret) SQL Server password
#      TENANT_SERVICE_URL
#      DATA_ACQUISITION_URL
#      REPORT_SERVICE_URL
#      NORMALIZATION_SERVICE_URL
#    nhsnlink-onboarding-prod:    - same keys, prod values
# ─────────────────────────────────────────────────────────────────────────────
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

pr: none

parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - prod

  - name: tool
    displayName: IaC Tool
    type: string
    default: bicep
    values:
      - bicep
      - terraform

  - name: destroyFirst
    displayName: Destroy before deploy (DANGEROUS — use only in dev)
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

stages:

  # ─── Preview / Plan ────────────────────────────────────────────────────────
  - stage: Preview
    displayName: 'Preview (${{ parameters.tool }} / ${{ parameters.environment }})'
    variables:
      - group: nhsnlink-onboarding-${{ parameters.environment }}
    jobs:
      - job: Plan
        displayName: ${{ upper(parameters.tool) }} preview
        steps:
          - checkout: self

          - ${{ if eq(parameters.tool, 'bicep') }}:
            - task: AzureCLI@2
              displayName: 'az deployment what-if'
              inputs:
                azureSubscription: $(AZURE_SERVICE_CONNECTION)
                scriptType: bash
                scriptLocation: inlineScript
                # az deployment group what-if requires the RG to exist (group-scoped operation).
                # Create it here so what-if works even after a teardown.
                # SQL_ADMIN_PASSWORD is read by readEnvironmentVariable() inside the .bicepparam file.
                inlineScript: |
                  # Only create RG if it doesn't already exist — avoids InvalidResourceGroupLocation
                  # when the RG was previously created in a different region.
                  if ! az group exists --name "$(RESOURCE_GROUP)" | grep -q "true"; then
                    az group create \
                      --name     "$(RESOURCE_GROUP)" \
                      --location "centralus" \
                      --tags     application=nhsnlink-onboarding environment=${{ parameters.environment }}
                  else
                    echo "Resource group already exists — skipping creation."
                  fi

                  az deployment group what-if \
                    --resource-group "$(RESOURCE_GROUP)" \
                    --template-file  infrastructure/main.bicep \
                    --parameters     infrastructure/${{ parameters.environment }}.bicepparam
              env:
                SQL_ADMIN_PASSWORD:        $(SQL_ADMIN_PASSWORD)
                TENANT_SERVICE_URL:        $(TENANT_SERVICE_URL)
                DATA_ACQUISITION_URL:      $(DATA_ACQUISITION_URL)
                REPORT_SERVICE_URL:        $(REPORT_SERVICE_URL)
                NORMALIZATION_SERVICE_URL: $(NORMALIZATION_SERVICE_URL)

          - ${{ if eq(parameters.tool, 'terraform') }}:
            - task: TerraformInstaller@1
              displayName: 'Install Terraform'
              inputs:
                terraformVersion: 'latest'

            - task: TerraformTaskV4@4
              displayName: 'terraform init'
              inputs:
                provider: azurerm
                command: init
                workingDirectory: infrastructure/terraform
                backendServiceArm: $(AZURE_SERVICE_CONNECTION)
                backendAzureRmResourceGroupName: rg-tfstate
                backendAzureRmStorageAccountName: nhsnobtfstate
                backendAzureRmContainerName: tfstate
                backendAzureRmKey: nhsnlink-onboarding-${{ parameters.environment }}.tfstate

            - task: TerraformTaskV4@4
              displayName: 'terraform plan'
              inputs:
                provider: azurerm
                command: plan
                workingDirectory: infrastructure/terraform
                commandOptions: >
                  -var-file=environments/${{ parameters.environment }}.tfvars
                  -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)"
                  -out=tfplan
                environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

  # ─── Deploy ────────────────────────────────────────────────────────────────
  # Uses ADO Environments for prod approval gate.
  # Create environment "nhsnlink-prod" in ADO → Approvals → add your approver(s).
  - stage: Deploy
    displayName: 'Deploy (${{ parameters.tool }} / ${{ parameters.environment }})'
    dependsOn: Preview
    condition: succeeded()
    variables:
      - group: nhsnlink-onboarding-${{ parameters.environment }}
    jobs:
      - deployment: DeployInfrastructure
        displayName: Deploy infrastructure
        environment: nhsnlink-${{ parameters.environment }}   # Approval gate lives here
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - ${{ if eq(parameters.tool, 'bicep') }}:
                  - task: AzureCLI@2
                    displayName: 'Deploy infrastructure (Bicep)'
                    inputs:
                      azureSubscription: $(AZURE_SERVICE_CONNECTION)
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail

                        # ── Resource group ──────────────────────────────────
                        if ! az group exists --name "$(RESOURCE_GROUP)" | grep -q "true"; then
                          az group create \
                            --name     "$(RESOURCE_GROUP)" \
                            --location "centralus" \
                            --tags     application=nhsnlink-onboarding environment=${{ parameters.environment }}
                        else
                          echo "Resource group already exists — skipping creation."
                        fi

                        # ── Pass 1: full Bicep deployment ───────────────────
                        # May fail on Container Apps if images don't exist yet (first run).
                        # Captured with set +e so we can handle the bootstrap below.
                        echo "Starting Bicep deployment (pass 1)..."
                        set +e
                        az deployment group create \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --template-file  infrastructure/main.bicep \
                          --parameters     infrastructure/${{ parameters.environment }}.bicepparam \
                          --name           "nhsnlink-onboarding-$(Build.BuildId)"
                        DEPLOY_EXIT=$?
                        set -e

                        if [ $DEPLOY_EXIT -eq 0 ]; then
                          echo "Pass 1 succeeded — no bootstrap needed."
                          az deployment group show \
                            --resource-group "$(RESOURCE_GROUP)" \
                            --name "nhsnlink-onboarding-$(Build.BuildId)" \
                            --query properties.outputs --output json
                          exit 0
                        fi

                        # ── Bootstrap: push placeholder images then retry ───
                        # Pass 1 failed — likely because ACR was just created but
                        # images don't exist yet. Push minimal placeholders and retry.
                        echo ""
                        echo "Pass 1 failed — checking for missing ACR images..."

                        ACR_NAME=$(az acr list \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --query "[0].name" -o tsv 2>/dev/null || true)

                        if [ -z "$ACR_NAME" ]; then
                          echo "ACR not found — deployment failed before ACR was created."
                          exit 1
                        fi

                        IMAGE_TAG="${PARAM_IMAGE_TAG:-dev}"
                        SERVER="${ACR_NAME}.azurecr.io"
                        az acr login --name "$ACR_NAME"

                        push_if_missing() {
                          local repo="$1" source="$2"
                          if az acr repository show-tags --name "$ACR_NAME" \
                               --repository "$repo" -o tsv 2>/dev/null \
                             | grep -q "^${IMAGE_TAG}$"; then
                            echo "  $repo:$IMAGE_TAG already present — skipping"
                          else
                            echo "  Pushing placeholder → $repo:$IMAGE_TAG"
                            docker pull "$source"
                            docker tag  "$source" "$SERVER/$repo:$IMAGE_TAG"
                            docker push "$SERVER/$repo:$IMAGE_TAG"
                          fi
                        }

                        push_if_missing nhsnlink-onboarding-service mcr.microsoft.com/dotnet/aspnet:10.0
                        push_if_missing nhsnlink-onboarding-web     nginx:alpine

                        # ── Pass 2: retry now that images exist ─────────────
                        echo ""
                        echo "Placeholder images ready — starting Bicep deployment (pass 2)..."
                        az deployment group create \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --template-file  infrastructure/main.bicep \
                          --parameters     infrastructure/${{ parameters.environment }}.bicepparam \
                          --name           "nhsnlink-onboarding-retry-$(Build.BuildId)"

                        echo ""
                        echo "Deployment complete."
                        az deployment group show \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --name "nhsnlink-onboarding-retry-$(Build.BuildId)" \
                          --query properties.outputs --output json
                    env:
                      SQL_ADMIN_PASSWORD:        $(SQL_ADMIN_PASSWORD)
                      TENANT_SERVICE_URL:        $(TENANT_SERVICE_URL)
                      DATA_ACQUISITION_URL:      $(DATA_ACQUISITION_URL)
                      REPORT_SERVICE_URL:        $(REPORT_SERVICE_URL)
                      NORMALIZATION_SERVICE_URL: $(NORMALIZATION_SERVICE_URL)
                      ${{ if eq(parameters.environment, 'prod') }}:
                        PARAM_IMAGE_TAG: latest
                      ${{ else }}:
                        PARAM_IMAGE_TAG: dev

                - ${{ if eq(parameters.tool, 'terraform') }}:
                  - task: TerraformInstaller@1
                    displayName: 'Install Terraform'
                    inputs:
                      terraformVersion: 'latest'

                  - task: TerraformTaskV4@4
                    displayName: 'terraform init'
                    inputs:
                      provider: azurerm
                      command: init
                      workingDirectory: infrastructure/terraform
                      backendServiceArm: $(AZURE_SERVICE_CONNECTION)
                      backendAzureRmResourceGroupName: rg-tfstate
                      backendAzureRmStorageAccountName: nhsnobtfstate
                      backendAzureRmContainerName: tfstate
                      backendAzureRmKey: nhsnlink-onboarding-${{ parameters.environment }}.tfstate

                  - task: TerraformTaskV4@4
                    displayName: 'terraform apply'
                    inputs:
                      provider: azurerm
                      command: apply
                      workingDirectory: infrastructure/terraform
                      commandOptions: >
                        -var-file=environments/${{ parameters.environment }}.tfvars
                        -var="sql_admin_password=$(SQL_ADMIN_PASSWORD)"
                        -auto-approve
                      environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)
