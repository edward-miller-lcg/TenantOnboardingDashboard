@if (breadcrumbs.length > 0) {
  <nav class="ob-breadcrumb">
    @for (crumb of breadcrumbs; track crumb.label; let last = $last) {
      @if (!last) {
        <a [routerLink]="crumb.route" class="ob-breadcrumb__link">{{ crumb.label }}</a>
        <span class="ob-breadcrumb__sep"> &gt; </span>
      } @else {
        <span class="ob-breadcrumb__current">{{ crumb.label }}</span>
      }
    }
  </nav>
}
